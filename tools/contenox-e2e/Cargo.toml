[package]
name = "contenox-e2e"
version = "0.1.0"
edition = "2024"
rust-version = "1.88.0"
publish = false
description = "Black-box end-to-end suite: drives the shipped contenox binary from outside the Go module"

[lib]
name = "contenox_e2e"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
