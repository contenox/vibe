# Task (go-task) is the build system: https://taskfile.dev
# Install: go install github.com/go-task/task/v3/cmd/task@latest
# Run `task --list` for the target overview.
version: '3'

vars:
  BIN_DIR: '{{.ROOT_DIR}}/bin'
  # Windows refuses to execute a file whose extension is not in PATHEXT, so the
  # native build must carry .exe there — an extensionless binary is not merely
  # unconventional on Windows, it is unrunnable. Every task that names the built
  # binary goes through BIN so the suffix cannot drift between them.
  EXE: '{{if eq OS "windows"}}.exe{{end}}'
  BIN: '{{.BIN_DIR}}/contenox{{.EXE}}'
  # ACP peers default to their in-repo builds when present, so the harness
  # targets run with zero manual env on a checkout that has built them
  # (tools/acp-validator README, rust-sdk at tools/rust-sdk). Explicit env
  # overrides; a missing binary keeps the clear set-this-var failure/skip.
  ACP_VALIDATOR_BIN:
    sh: ls {{.ROOT_DIR}}/tools/acp-validator/target/debug/acp-validator 2>/dev/null || true
  ACP_YOPO_BIN:
    sh: ls {{.ROOT_DIR}}/tools/rust-sdk/target/debug/yopo 2>/dev/null || true
  ACP_TESTY_BIN:
    sh: ls {{.ROOT_DIR}}/tools/rust-sdk/target/debug/testy 2>/dev/null || true
  ACP_MCP_ECHO_BIN:
    sh: ls {{.ROOT_DIR}}/tools/rust-sdk/target/debug/mcp-echo-server 2>/dev/null || true

tasks:
  default:
    desc: List available tasks
    silent: true
    cmds:
      - task --list

  build:
    desc: Build the contenox CLI (pure Go, static)
    cmds:
      - CGO_ENABLED=0 go build -o {{.BIN}} {{.ROOT_DIR}}/cmd/contenox

  build-windows:
    desc: Cross-build the Windows CLI binary
    cmds:
      - CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o {{.BIN_DIR}}/contenox-windows-amd64.exe {{.ROOT_DIR}}/cmd/contenox

  lint:
    desc: The formatting and static gates CI enforces (gofmt, vet)
    cmds:
      - cmd: |
          # Skip gitignored paths so this agrees with CI, which lints a clean
          # checkout; a local scratch dir must not fail a gate CI would pass.
          unformatted=$(gofmt -l . | while read -r f; do git check-ignore -q "$f" || echo "$f"; done)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            echo "gofmt found unformatted files (above). Fix with, gofmt -w ."
            exit 1
          fi
      - go vet ./...

  vuln:
    desc: Known vulnerabilities in reachable code (the same gate CI runs)
    cmds:
      # Deliberately unpinned: a scanner's value is the freshness of its
      # database, and it is fetched through the module proxy and verified
      # against sum.golang.org.
      - go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  test:
    desc: Full serial Go test suite
    cmds:
      - GOMAXPROCS=1 go test -timeout 30m ./...

  test-unit:
    desc: Fast unit gate (TestUnit_, -short)
    cmds:
      - GOMAXPROCS=4 go test -short -timeout 15m -run '^TestUnit_' ./...

  # Every backend suite runs through this wrapper, because a suite that skipped
  # for want of Docker is indistinguishable from one that passed: `go test`
  # prints a skip only under -v, so the plain command ended in a green `ok`.
  # Two things fix that here. The suites run under -v, so an in-suite skip
  # ("Postgres store NOT exercised: ...") is on screen. And a missing container
  # engine is reported before the run in the shape acp-suites uses — SKIPPED,
  # not passed — rather than as a pass.
  #
  # REQUIRE lists the suite's own require-env variables (.github/workflows/ci.yml
  # sets them). With one of them set the suite runs even when the probe finds no
  # engine, so a broken engine on a CI runner fails the job instead of skipping
  # it. Unset, which is the normal local state, nothing here needs Docker.
  #
  # Every suite runs with -count=1. A cached `ok` from an earlier run with Docker
  # up is the same false green in a different disguise: nothing would touch a
  # container, and the smoke exists to touch one.
  backend-suite:
    internal: true
    silent: true
    cmds:
      - |
        set -e
        required=""
        for name in {{.REQUIRE}}; do
          eval "value=\${$name:-}"
          if [ -n "$value" ]; then required=1; fi
        done
        if [ -z "$required" ] && ! docker info >/dev/null 2>&1 && ! podman info >/dev/null 2>&1; then
          printf '\n==> SKIPPED, not passed: %s\n' '{{.NAME}}'
          printf '    %s\n' '{{.WHAT}}'
          printf '    No container engine answered (tried: docker info, podman info). Start one to run it,\n'
          printf '    or set any of [%s] to 1 to turn this skip into a failure.\n\n' '{{.REQUIRE}}'
          exit 0
        fi
        {{.RUN}}

  test-store-postgres:
    desc: The store suite against a throwaway Postgres container (needs Docker; says SKIPPED without it)
    cmds:
      - task: backend-suite
        vars:
          NAME: test-store-postgres
          WHAT: 'The store suite did not run against Postgres; its Postgres DDL and every $N query are unproven.'
          REQUIRE: CONTENOX_TEST_REQUIRE_POSTGRES
          RUN: CONTENOX_TEST_STORE_BACKEND=postgres go test -v -count=1 -timeout 15m ./internal/store/...

  test-bus-nats:
    desc: The libbus conformance suite, whose NATS backend runs in a throwaway container (needs Docker; says SKIPPED without it)
    cmds:
      # The whole conformance suite, not a NATS-only -run filter: the suite's
      # contract is that every backend passes the same matrix, and `go test
      # -run` splits on '/', so no single pattern selects the NATS leaf of both
      # the three-level TestConformance_* names and the two-level
      # TestConformanceDivergence_* ones. The InMem and SQLite halves are the
      # cheap ones anyway.
      - task: backend-suite
        vars:
          NAME: test-bus-nats
          WHAT: 'The NATS half of the libbus conformance matrix did not run.'
          REQUIRE: LIBBUS_REQUIRE_NATS
          RUN: go test -v -count=1 -timeout 10m -run '^TestConformance' ./libbus/...

  test-kv-valkey:
    desc: libkvstore against a throwaway Valkey container (needs Docker; says SKIPPED without it)
    cmds:
      - task: backend-suite
        vars:
          NAME: test-kv-valkey
          WHAT: 'The Valkey KVExecutor did not run against a server.'
          REQUIRE: LIBKVSTORE_REQUIRE_VALKEY
          RUN: go test -v -count=1 -timeout 10m -run '^TestUnit_Valkey' ./libkvstore/...

  # internal/substrate is the opt-in wiring itself: which backend each of
  # CONTENOX_POSTGRES_URL / CONTENOX_NATS_URL / CONTENOX_VALKEY_URL selects, and
  # that a set-but-unreachable setting is refused by name instead of silently
  # degrading to the SQLite file. Its container-backed cases skip under -short,
  # so the -short unit gate alone never proves any of it.
  test-substrate:
    desc: The opt-in substrate wiring against real Postgres, NATS and Valkey containers (needs Docker; says SKIPPED without it)
    cmds:
      - task: backend-suite
        vars:
          NAME: test-substrate
          WHAT: 'The substrate wiring did not run against any real backend, only against the SQLite default.'
          REQUIRE: CONTENOX_TEST_REQUIRE_POSTGRES LIBBUS_REQUIRE_NATS LIBKVSTORE_REQUIRE_VALKEY
          RUN: go test -v -count=1 -timeout 10m ./internal/substrate/...

  # The opt-in backends a CONTENOX_POSTGRES_URL / CONTENOX_NATS_URL /
  # CONTENOX_VALKEY_URL install lands on, plus the wiring that selects them.
  # This capability decayed once because nothing ran it; CI runs these same
  # tasks, with each suite's require-env set so an absent Docker fails instead
  # of skipping.
  test-backends:
    desc: 'Smoke the opt-in backends: Postgres, NATS, Valkey, and the wiring that selects them (needs Docker; each suite says SKIPPED without it)'
    cmds:
      - task: test-store-postgres
      - task: test-bus-nats
      - task: test-kv-valkey
      - task: test-substrate

  test-system:
    desc: System tests (TestSystem_)
    cmds:
      - GOMAXPROCS=1 go test -run '^TestSystem_' ./...

  test-cli-verbose:
    desc: Verbose CLI package tests
    cmds:
      - GOMAXPROCS=4 go test -v ./internal/surfaces/contenoxcli/...

  test-cli-help:
    desc: Verify CLI help output against the golden script
    deps: [build]
    cmds:
      - chmod +x {{.ROOT_DIR}}/scripts/verify_cli_help.sh
      - CONTENOX_BIN={{.BIN_DIR}}/contenox {{.ROOT_DIR}}/scripts/verify_cli_help.sh

  acp-conformance:
    desc: Validate libacp agent-side wire dispatch against the Rust reference ACP clients
    preconditions:
      - sh: test -n "{{.ACP_VALIDATOR_BIN}}"
        msg: 'set ACP_VALIDATOR_BIN=/path/to/acp-validator (build tools/acp-validator; see its README)'
    cmds:
      - ACP_VALIDATOR_BIN={{.ACP_VALIDATOR_BIN}} ACP_YOPO_BIN={{.ACP_YOPO_BIN}} ACP_STUB_ADVERTISE_MODES=1 go test -run '^TestConformance_' -v ./libacp/...

  acp-client-e2e:
    desc: Validate libacp client-side wire dispatch against the Rust reference testy agent
    preconditions:
      - sh: test -n "{{.ACP_TESTY_BIN}}"
        msg: 'set ACP_TESTY_BIN=/path/to/testy (build the agentclientprotocol rust-sdk test agent)'
    cmds:
      - ACP_TESTY_BIN={{.ACP_TESTY_BIN}} ACP_MCP_ECHO_BIN={{.ACP_MCP_ECHO_BIN}} go test -run '^TestTesty_' -v ./libacp/acpexec/...

  # Invoked by name, the two Rust-backed suites above fail when their binary is
  # unset — you asked for them. Inside test-all they are skipped instead, loudly:
  # a missing external toolchain is not a failing gate, and a hard stop there
  # makes the one-command gate unrunnable on a fresh clone. A suite that RUNS
  # still fails the gate.
  acp-suites:
    desc: 'The ACP suites: self-loopback always, the Rust-backed ones when their binaries are set'
    silent: true
    cmds:
      - |
        set -e
        skipped=""
        if [ -n "{{.ACP_VALIDATOR_BIN}}" ]; then
          task acp-conformance
        else
          skipped="${skipped}\n  - acp-conformance   set ACP_VALIDATOR_BIN (tools/acp-validator/README.md: needs Rust and a sibling rust-sdk checkout)"
        fi
        if [ -n "{{.ACP_TESTY_BIN}}" ]; then
          task acp-client-e2e
        else
          skipped="${skipped}\n  - acp-client-e2e    set ACP_TESTY_BIN (the agentclientprotocol rust-sdk test agent)"
        fi
        task acp-host-e2e
        if [ -n "$skipped" ]; then
          printf "\n==> SKIPPED, not passed:%b\n\n" "$skipped"
        fi

  acp-host-e2e:
    desc: 'Registry→resolve→spawn→session host path, end to end (every case needs a binary or a non-sandboxed spawn path — all skip on a bare checkout)'
    cmds:
      - ACP_TESTY_BIN={{.ACP_TESTY_BIN}} ACP_MCP_ECHO_BIN={{.ACP_MCP_ECHO_BIN}} ACP_CLAUDE_ACP_BIN=$ACP_CLAUDE_ACP_BIN go test -run '^TestHostE2E_' -v ./internal/services/agenthost/...

  test-all:
    desc: 'The one-command release gate: build, then every suite, fast gates first'
    deps: [build, 'website:build']
    cmds:
      # Cheapest gates first, and in CI's order, so a release run fails on a
      # formatting or vulnerability regression before spending 30m on tests.
      - task: lint
      - task: vuln
      - task: test-unit
      - task: test-cli-help
      - task: acp-suites
      - task: test
      - 'echo "==> test-all: every gate that ran is green — re-read any SKIPPED notice above before releasing"'

  dev-install:
    desc: Build and put the CLI on your PATH (~/.local/bin, or %LOCALAPPDATA%\Programs\contenox on Windows)
    deps: [build]
    cmds:
      - task: dev-link

  # POSIX symlinks into ~/.local/bin; Windows copies into a directory it also
  # registers on the user PATH, because Windows has no conventional bin dir
  # that is already there. See scripts/dev-install.ps1 for why it copies.
  dev-link:
    desc: Put bin/contenox on your PATH
    deps: [build]
    cmds:
      - cmd: mkdir -p $HOME/.local/bin
        platforms: [linux, darwin]
      - cmd: ln -sf {{.BIN}} $HOME/.local/bin/contenox
        platforms: [linux, darwin]
      - cmd: 'echo "Linked $HOME/.local/bin/contenox -> {{.BIN}} (ensure ~/.local/bin precedes other installs on PATH)"'
        platforms: [linux, darwin]
      - cmd: powershell -NoProfile -ExecutionPolicy Bypass -File {{.ROOT_DIR}}/scripts/dev-install.ps1 -Source {{.BIN}}
        platforms: [windows]

  dev-unlink:
    desc: Remove the installed CLI from your PATH
    cmds:
      - cmd: rm -f $HOME/.local/bin/contenox
        platforms: [linux, darwin]
      - cmd: powershell -NoProfile -ExecutionPolicy Bypass -File {{.ROOT_DIR}}/scripts/dev-install.ps1 -Uninstall
        platforms: [windows]

  website:deps:
    desc: Install website dependencies
    dir: website
    cmds:
      - npm ci

  website:dev:
    desc: Run the website dev server
    dir: website
    cmds:
      - npm run dev

  website:build:
    desc: Build the static website
    dir: website
    cmds:
      - npm run build

  website:preview:
    desc: Preview the built website
    deps: ['website:build']
    dir: website
    cmds:
      - npm run preview


  spec:generate:
    desc: Regenerate schema/*.schema.json from the Go types users author against
    cmds:
      - go run {{.ROOT_DIR}}/tools/schema-gen -project {{.ROOT_DIR}} -output schema

  spec:verify:
    desc: Regenerate the JSON schemas to a temp dir and fail on drift
    cmds:
      - defer: rm -rf {{.ROOT_DIR}}/.verify
      - go run {{.ROOT_DIR}}/tools/schema-gen -project {{.ROOT_DIR}} -output .verify
      # `git diff --no-index` rather than `diff`: it ships wherever git does,
      # including a Windows checkout with no diff(1) on PATH, and prints a
      # reviewable patch instead of a byte offset.
      - git --no-pager diff --no-index --exit-code {{.ROOT_DIR}}/schema {{.ROOT_DIR}}/.verify

  version:set:
    desc: Stamp the version file (tools/version)
    cmds:
      - go run {{.ROOT_DIR}}/tools/version/main.go set

  version:bump-patch:
    desc: Bump patch version, create release commit and tag
    cmds:
      - go run {{.ROOT_DIR}}/tools/version/main.go bump patch

  version:bump-minor:
    desc: Bump minor version, create release commit and tag
    cmds:
      - go run {{.ROOT_DIR}}/tools/version/main.go bump minor

  version:bump-major:
    desc: Bump major version, create release commit and tag
    cmds:
      - go run {{.ROOT_DIR}}/tools/version/main.go bump major

  release:
    desc: Print the release runbook
    silent: true
    cmds:
      - 'echo "Release process (must match .github/workflows/release.yml):"'
      - 'echo "  1. Bump: task version:bump-patch|version:bump-minor|version:bump-major"'
      - 'echo "  2. Review the generated release commit and tag"'
      - 'echo "  3. Push: git push && git push origin vX.Y.Z"'
      - 'echo "CI verifies internal/version/version.txt matches the tag, then builds and publishes assets."'

  clean:
    desc: Remove build outputs
    cmds:
      - cmd: rm -rf {{.BIN_DIR}}
        platforms: [linux, darwin]
      - cmd: powershell -NoProfile -Command "if (Test-Path -LiteralPath '{{.BIN_DIR}}') { Remove-Item -LiteralPath '{{.BIN_DIR}}' -Recurse -Force }"
        platforms: [windows]
