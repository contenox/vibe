  <path class="b2" d="M207.21,164.77v170.47h-84.96c0-54.58,21.64-106.94,60.17-145.6l24.79-24.87Z"/>
  <path class="b3" d="M207.21,335.23h170.47s0,84.96,0,84.96h0c-54.58,0-106.94-21.64-145.6-60.17l-24.87-24.79Z"/>
