<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <style>
    /* Beam gold, tab-strip aware: light browser themes get the darkened amber
       ramp (a flat bright gold washes out on white/light-gray selected tabs);
       dark themes get the luminous ramp. */
    .b1 { fill: #b45309; }
    .b2 { fill: #d97706; }
    .b3 { fill: #f59e0b; }
    @media (prefers-color-scheme: dark) {
      .b1 { fill: #fcd34d; }
      .b2 { fill: #fbbf24; }
      .b3 { fill: #f59e0b; }
    }
  </style>
